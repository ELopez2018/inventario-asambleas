<mat-sidenav-container class="app-shell bg-slate-50" [hasBackdrop]="isCompact()">
  <mat-sidenav
    #sidenav
    id="app-navigation"
    class="w-64 border-r border-slate-200 bg-slate-950 text-white"
    [mode]="isCompact() ? 'over' : 'side'"
    [opened]="!isCompact()"
    aria-label="Navegacion principal"
  >
    <div class="flex items-center gap-2 border-b border-white/10 px-5 py-2">
      <div class="min-w-0 flex-1 py-2">
        <div class="text-base font-semibold">Inventario AR 2026</div>
        <div class="text-xs text-slate-300">Asamblea Regional</div>
      </div>
      @if (isCompact()) {
        <button
          mat-icon-button
          type="button"
          class="shrink-0 text-white"
          aria-label="Cerrar menu de navegacion"
          (click)="sidenav.close()"
        >
          <mat-icon>close</mat-icon>
        </button>
      }
    </div>

    <mat-nav-list class="app-nav-list" aria-label="Secciones de la aplicacion">
      @for (item of navItems; track item.path) {
        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive="active-link"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          (click)="closeNavigation(sidenav)"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="flex min-h-0 min-w-0 flex-col overflow-hidden">
    <mat-toolbar color="primary" class="app-toolbar shrink-0">
      @if (isCompact()) {
        <button
          mat-icon-button
          type="button"
          aria-label="Abrir menu de navegacion"
          aria-controls="app-navigation"
          [attr.aria-expanded]="sidenav.opened"
          (click)="sidenav.toggle()"
        >
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="ml-1 shrink-0 text-base font-medium">Inventario</span>
      <span class="flex-1"></span>
      @if (currentUser?.username) {
        <span class="mr-2 hidden max-w-40 truncate text-sm sm:inline md:max-w-56">
          {{ currentUser?.username }}
        </span>
      }
      <button mat-icon-button type="button" aria-label="Cerrar sesion" (click)="auth.logout()">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <main class="app-main-content min-h-0 min-w-0 flex-1 overflow-auto p-3 sm:p-4 lg:p-6">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>

<div class="request-pdf-dialog">
  <header class="request-pdf-dialog__header">
    <div>
      <h2 mat-dialog-title>{{ data.title || 'Formulario CO-31' }}</h2>
      <p>{{ data.subtitle || 'Solicitud CO-31 ' + data.requestNumber }}</p>
    </div>
    <button mat-icon-button type="button" aria-label="Cerrar" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <mat-dialog-content class="request-pdf-dialog__content">
    <iframe
      class="request-pdf-dialog__frame"
      [src]="safePdfUrl"
      [title]="data.title || 'Formulario CO-31'"
    ></iframe>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-stroked-button type="button" (click)="openInNewTab()">
      <mat-icon>open_in_new</mat-icon>
      Abrir
    </button>
    <button mat-flat-button color="primary" type="button" (click)="close()">Cerrar</button>
  </mat-dialog-actions>
</div>
